const R = D.rows, C = D.cols, N = R * C;
const M = 14;

const cx = c => M + (c % C) * S + S / 2, cy = c => M + Math.floor(c / C) * S + S / 2;
function seg(k) {
  const a = Math.min(D.a[k], D.b[k]), b = Math.max(D.a[k], D.b[k]);

function step(dr, dc) {
